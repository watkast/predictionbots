# Paper-trading matrix: one entry per (strategy, venue, market selector, signals).
# `scripts/paper_matrix.py --entry <name> --duration 3300` runs one; `--all` runs them
# sequentially. Every entry is paper-only. `requires_env` entries are skipped when the
# variable is missing. `params_override` sets strategy params on top of the params file
# (passed as `--set k=v`); `args` are extra scripts/paper.py flags. `roll_secs` is how
# often the market selector is re-run during the run so newly listed markets (the next
# KXBTC15M window, the next day's weather ladder) join and settled ones leave.
#
# 2026-10-26: the whole matrix is RETIRED (see `retired:` below and reports/README.md for the
# final leaderboard). Seven paper days against live books: every maker model lost or never
# filled, both taker baselines lost as designed, ORACLE-LAG lost heavily. The only live
# research is the Early Favorite line (scripts/early_favorite_tracker.py, scripts/ef_autobuyer.py,
# workflows polyus.yml / ef-autobuyer.yml). To revive an entry, move it back under `runs:` and
# re-enable the cron in .github/workflows/paper.yml (and record.yml / backtest.yml if wanted).
defaults:
  duration: 3300          # seconds (fits a GitHub Actions hourly job)
  roll_secs: 60
  max_position: 200
  daily_loss_limit: 50
  max_capital: 2000
  max_capital_per_market: 500
  record: true

runs: []

retired:
