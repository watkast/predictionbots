# Move finished data out of git into release assets (scripts/archive_release.py), and rebuild a data branch without
# what has provably moved. The repository passed 10 GB on 13 Nov 2026; the recorder's books add about 8 GB a month.
#   pack   copies folders of a data branch into a release, downloads the upload back and compares every file with git,
#          and only then writes archive/<name>.tsv to the branch. It removes nothing.
#   prune  rebuilds the branch as one commit without the files those manifests cover. Without "apply" it prints the plan.
# A file can leave git only when (path, blob id) is in a manifest and the release still holds the asset as recorded.
name: archive
on:
  # Daily roll: recorder days older than a week go to release assets, then mrp-data is rebuilt without them. The
  # last two days of commits are replayed with their dates (the watchdog reads them); older history is one commit.
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:
    inputs:
      pack:
        description: "What to copy to release assets"
        type: choice
        options: [none, books, retired-data, retired-mrp, recorder-v1]
        default: none
      keep_days:
        description: "books: recorder days that stay in git, today included"
        default: "7"
      prune_branch:
        description: "Rebuild this branch without what the manifests on it cover"
        type: choice
        options: [none, mrp-data, data]
        default: none
      apply:
        description: "Move the branch (unticked: print the plan only)"
        type: boolean
        default: false
      backup:
        description: "With apply: keep the old tip as backup/<branch>-<this> (empty = no backup)"
        default: ""
      history_days:
        description: "Prune: replay the commits of the last N days with their dates (0: one commit)"
        default: "0"

permissions:
  contents: write

concurrency:      # the same job twice waits its turn; different jobs may run side by side (prune moves a branch only with a lease)
  group: archive-${{ inputs.pack }}-${{ inputs.prune_branch }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      RETIRED_TITLE: "Retired experiments, October to November 2026"
      RETIRED_NOTES: >-
        Data from experiments we stopped, moved out of this repository's data branches on 13 Nov 2026 so the
        repository stays small. None of it feeds the site.
        `paper-matrix-logs`: console logs and ledgers of the paper-trading matrix, 16 to 26 Oct 2026 (was `ledger/`
        on the `data` branch).
        `sports-radar`: the sports radar's scans, 29 Oct to 13 Nov 2026 (was `mrp/radar/` on `mrp-data`).
        `research-nfl-comeback`: the NFL comeback study and its cache (was `mrp/research/` on `mrp-data`).
        `archive/<name>.tsv` on the branch a set came from lists every file with its git blob id and sha256;
        the paths inside each tar are the paths the files had in git.
      V1_TITLE: "First recorder's books, 16 to 26 October 2026"
      V1_NOTES: >-
        Order books and trades recorded on Kalshi and Polymarket by this project's first recorder (the `record`
        workflow), 16 to 26 Oct 2026, as parquet files, and that recorder's console logs. Moved out of the `data`
        branch (`recorded/`) on 13 Nov 2026; the newer recorder's books are in the `books-YYYY-MM` releases.
        `recorder-v1-polymarket` is one tar in parts: `cat recorder-v1-polymarket.tar.part* > recorder-v1-polymarket.tar`.
        `archive/<name>.tsv` on the `data` branch lists every file with its git blob id and sha256; the paths
        inside each tar are the paths the files had in git.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Disk
        run: df -h "$RUNNER_TEMP" | tail -1
      - name: Daily roll (books older than a week to releases, then rebuild mrp-data)
        if: github.event_name == 'schedule'
        run: |
          export ARCHIVE_WORK="$RUNNER_TEMP/archive"
          python scripts/archive_release.py books --keep-days 7
          python scripts/archive_release.py prune mrp-data --apply --history-days 2
      - name: Pack (copy, upload, download back, compare; removes nothing)
        if: github.event_name == 'workflow_dispatch' && inputs.pack != 'none'
        run: |
          export ARCHIVE_WORK="$RUNNER_TEMP/archive"
          case "${{ inputs.pack }}" in
            books)
              python scripts/archive_release.py books --keep-days "${{ inputs.keep_days }}" ;;
            retired-data)
              python scripts/archive_release.py pack data paper-matrix-logs retired-2026-11 ledger --title "$RETIRED_TITLE" --notes "$RETIRED_NOTES" ;;
            retired-mrp)
              python scripts/archive_release.py pack mrp-data sports-radar retired-2026-11 mrp/radar --title "$RETIRED_TITLE" --notes "$RETIRED_NOTES"
              python scripts/archive_release.py pack mrp-data research-nfl-comeback retired-2026-11 mrp/research --title "$RETIRED_TITLE" --notes "$RETIRED_NOTES" ;;
            recorder-v1)
              python scripts/archive_release.py pack data recorder-v1-logs recorder-v1-2026-10 recorded/logs --title "$V1_TITLE" --notes "$V1_NOTES"
              python scripts/archive_release.py pack data recorder-v1-kalshi recorder-v1-2026-10 recorded/kalshi --title "$V1_TITLE" --notes "$V1_NOTES"
              python scripts/archive_release.py pack data recorder-v1-polymarket recorder-v1-2026-10 recorded/polymarket --title "$V1_TITLE" --notes "$V1_NOTES" ;;
          esac
      - name: Prune (rebuild the branch without what the manifests cover)
        if: github.event_name == 'workflow_dispatch' && inputs.prune_branch != 'none'
        run: |
          export ARCHIVE_WORK="$RUNNER_TEMP/archive"
          args=(--history-days "${{ inputs.history_days || '0' }}")
          if [ "${{ inputs.apply }}" = "true" ]; then args+=(--apply); fi
          if [ -n "${{ inputs.backup }}" ]; then args+=(--backup "backup/${{ inputs.prune_branch }}-${{ inputs.backup }}"); fi
          python scripts/archive_release.py prune "${{ inputs.prune_branch }}" "${args[@]}"
      - name: Disk after
        if: always()
        run: df -h "$RUNNER_TEMP" | tail -1
