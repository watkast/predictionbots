name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Synthetic smoke (framework only, never for evaluation)
        run: python scripts/backtest.py --strategy mm_inventory --synthetic --report-name ci_smoke
      - name: Live API parser smoke (public endpoints; informational)
        continue-on-error: true
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY_PEM: ${{ secrets.KALSHI_PRIVATE_KEY_PEM }}
        run: python scripts/smoke_live.py 2>&1 | tee smoke_live.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-live-log
          path: smoke_live.log
          if-no-files-found: ignore
      - name: Publish smoke log to data branch (readable without artifact download)
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name predictionbots-ci; git config user.email bots@users.noreply.github.com
          git fetch origin data || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then git worktree add ../datawt origin/data; else git worktree add --orphan -b data ../datawt; fi
          mkdir -p ../datawt/logs && cp smoke_live.log "../datawt/logs/smoke_live_$(date -u +%Y%m%dT%H%M).log"
          cp reports/ci_smoke.md ../datawt/logs/ 2>/dev/null || true
          cd ../datawt && git add -A && (git commit -qm "ci log $(date -u +%FT%TZ)" || exit 0)
          for i in 1 2 3; do git push origin HEAD:data && break; git fetch origin data && git rebase origin/data || git rebase --abort; sleep 7; done
