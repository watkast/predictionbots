# SITE BUILD + DEPLOY: render the posts, generate one page per market series from the venues' public APIs, and deploy
# to Cloudflare Pages when the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets exist. Without them the build is
# uploaded as a workflow artifact and a preview (the markets index, series.json and a few sample pages) is pushed to
# `site-preview/` on the `data` branch so the output can be inspected. Hourly so the market pages stay current.
name: site-deploy
on:
  workflow_dispatch:
    inputs:
      max_series:
        description: "Cap on series per venue (0 = all)"
        default: "0"
      venue:
        description: "kalshi | pmus | both"
        default: "both"
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths: ["site/**", "scripts/market_pages.py", ".github/workflows/site-deploy.yml"]

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install httpx markdown
      - run: python scripts/market_pages.py selftest
      - name: Build the site
        run: python site/build.py
      - name: Generate market pages
        run: |
          MAX="${{ github.event.inputs.max_series || '0' }}"; ARG=""; [ "$MAX" != "0" ] && ARG="--max-series $MAX"
          python scripts/market_pages.py build --out site/dist/markets --venue "${{ github.event.inputs.venue || 'both' }}" $ARG 2> gen.log | tee -a "$GITHUB_STEP_SUMMARY"
          tail -40 gen.log
          echo "pages: $(find site/dist/markets -name index.html | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: site-dist, path: site/dist, retention-days: 3 }
      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy dist --project-name=predictionbots --commit-dirty=true
      - name: Publish a preview to the data branch (no Cloudflare secrets yet)
        if: env.CF_TOKEN == ''
        run: |
          git config --global user.name "predictionbots-site"
          git config --global user.email "bots@users.noreply.github.com"
          git fetch -q origin data || true
          git worktree add ../datawt origin/data
          for i in 1 2 3 4 5; do
            git -C ../datawt fetch -q origin data && git -C ../datawt reset -q --hard origin/data
            rm -rf ../datawt/site-preview && mkdir -p ../datawt/site-preview
            cp site/dist/markets/index.html site/dist/markets/series.json site/dist/sitemap.xml ../datawt/site-preview/ 2>/dev/null || true
            cp gen.log ../datawt/site-preview/gen.log
            mkdir -p ../datawt/site-preview/samples
            find site/dist/markets -mindepth 3 -name index.html | head -6 | while read f; do d=$(basename $(dirname "$f")); cp "$f" "../datawt/site-preview/samples/$d.html"; done
            git -C ../datawt add -A site-preview
            git -C ../datawt commit -qm "site-preview $(date -u +%FT%TZ)" || { echo "nothing new"; exit 0; }
            git -C ../datawt push -q origin HEAD:data && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          echo "publish failed after 5 tries"; exit 1
