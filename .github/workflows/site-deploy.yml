# SITE BUILD + DEPLOY: render the posts, generate one page per market series from the venues' public APIs, and deploy
# to Cloudflare Pages when the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets exist. Without them the build is
# uploaded as a workflow artifact and a preview (the markets index, series.json and a few sample pages) is pushed to
# `site-preview/` on the small `mrp-data` branch (sparse, blobless) so the output can be inspected. Scheduled hourly; GitHub
# runs a scheduled workflow when it has capacity, which for this repo has meant a few times a day (each page states the
# time of its prices). Build inputs are read only from hosts we own (predictmenot.com, this repo's branches).
name: site-deploy
on:
  workflow_dispatch:
    inputs:
      max_series:
        description: "Cap on series per venue (0 = all)"
        default: "0"
      venue:
        description: "kalshi | pmus | both"
        default: "both"
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths: ["site/**", "scripts/market_pages.py", ".github/workflows/site-deploy.yml"]

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install httpx markdown pillow
      - run: python scripts/market_pages.py selftest
      - name: Reference rates (Treasury, TreasuryDirect)
        run: python scripts/rates.py || true
      - name: Build the site
        run: python site/build.py
      # The odds snapshot carries the API quota state (time of the last paid fetch, credits used). It is kept in two
      # places we control: the Actions cache (saved right after generation, so a failed deploy cannot lose it) and
      # site-preview/ on mrp-data. scripts/sports_odds.py takes the newest readable copy.
      - name: Odds snapshot from the Actions cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: cache/odds.json
          key: odds-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: odds-state-
      - name: Series metadata and odds caches from the last run
        run: |
          mkdir -p cache
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/mrp-data/site-preview"
          # Only hosts we own, and only if the answer is JSON: the Pages site answers an unknown path with its home page.
          fetch_json() {   # fetch_json <url> <file>
            if curl -sSfL --max-time 120 -o "$2.tmp" "$1" && python -c 'import json,sys; json.load(open(sys.argv[1]))' "$2.tmp" 2>/dev/null; then
              mv "$2.tmp" "$2"; echo "cache: $(basename "$2") from $1"; return 0
            fi
            rm -f "$2.tmp"; return 1
          }
          fetch_json "https://predictmenot.com/markets/series_meta.json" cache/series_meta.json \
            || fetch_json "$RAW/series_meta.json" cache/series_meta.json \
            || echo "{}" > cache/series_meta.json
          fetch_json "$RAW/odds.json" cache/odds.remote.json || true
          echo "cache entries: $(python -c 'import json;print(len(json.load(open("cache/series_meta.json"))))')"
      - name: Generate market pages
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          MAX="${{ github.event.inputs.max_series || '0' }}"; ARG=""; [ "$MAX" != "0" ] && ARG="--max-series $MAX"
          python scripts/market_pages.py build --out site/dist/markets --venue "${{ github.event.inputs.venue || 'both' }}" --series-cache cache/series_meta.json $ARG 2> gen.log | tee -a "$GITHUB_STEP_SUMMARY"
          tail -40 gen.log
          echo "pages: $(find site/dist/markets -name index.html | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the odds snapshot (quota state) even if a later step fails
        if: always() && hashFiles('cache/odds.json') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: cache/odds.json
          key: odds-state-${{ github.run_id }}-${{ github.run_attempt }}
      # last step that touches the pages: every link to our own CSS or JS gets the file's hash, so a page can never be
      # shown with an older stylesheet that a browser or a cache still holds (13 Nov 2026: a fixed phone header that
      # a phone did not get)
      - name: Stamp CSS and JS links with the files' hashes
        run: |
          set -o pipefail
          python site/stamp_assets.py site/dist | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Internal link check
        run: python site/link_check.py | head -60 | tee -a "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with: { name: site-dist, path: site/dist, retention-days: 3 }
      - uses: actions/setup-node@v4
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        with: { node-version: "22" }
      - name: Deploy to Cloudflare Pages (creates D1 + KV and binds them on first run)
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash deploy.sh
      - name: Publish the preview and the weather history to the mrp-data branch
        run: |
          git config --global user.name "predictionbots-site"
          git config --global user.email "bots@users.noreply.github.com"
          mkdir -p ../pv && cd ../pv
          git init -q && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git config core.sparseCheckout true && git sparse-checkout set --no-cone site-preview weather
          for i in 1 2 3 4 5; do
            git fetch -q --filter=blob:none --depth 1 origin mrp-data && git checkout -q -B mrp-data FETCH_HEAD
            rm -rf site-preview && mkdir -p site-preview/samples
            cp "$GITHUB_WORKSPACE"/site/dist/markets/index.html "$GITHUB_WORKSPACE"/site/dist/markets/series.json "$GITHUB_WORKSPACE"/site/dist/sitemap.xml site-preview/ 2>/dev/null || true
            cp "$GITHUB_WORKSPACE"/gen.log site-preview/gen.log; cp "$GITHUB_WORKSPACE"/site/data/rates.json site-preview/rates.json; cp "$GITHUB_WORKSPACE"/site/dist/markets/series_meta.json site-preview/series_meta.json 2>/dev/null || true
            cp "$GITHUB_WORKSPACE"/site/dist/markets/odds.json site-preview/odds.json 2>/dev/null || true
            cp "$GITHUB_WORKSPACE"/site/dist/markets/kalshi/kxhighden/index.html site-preview/samples/kalshi-kxhighden.html 2>/dev/null || true
            for v in kalshi pmus; do find "$GITHUB_WORKSPACE"/site/dist/markets/$v -mindepth 2 -name index.html | shuf -n 5 --random-source=<(yes) | while read f; do d=$(basename $(dirname "$f")); cp "$f" "site-preview/samples/$v-$d.html"; done; done
            if [ -f "$GITHUB_WORKSPACE"/site/dist/markets/weather_snapshot.jsonl ]; then mkdir -p weather; cat "$GITHUB_WORKSPACE"/site/dist/markets/weather_snapshot.jsonl >> weather/snapshots.jsonl; git add weather; fi
            git add -A site-preview
            git commit -qm "site-preview $(date -u +%FT%TZ)" || { echo "nothing new"; exit 0; }
            git push -q origin HEAD:mrp-data && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          echo "publish failed after 5 tries"; exit 1
