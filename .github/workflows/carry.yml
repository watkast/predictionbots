# Venture #2: funding-rate carry. Nightly: download funding/candle history and
# run the backtest. Hourly: poll live funding and tick the paper ledger (no
# orders). Data lives on the `data` branch under carry/; reports on main.
name: carry
on:
  schedule:
    - cron: "41 * * * *"      # hourly paper tick
    - cron: "17 3 * * *"      # nightly download + backtest
  workflow_dispatch:
    inputs:
      job:
        description: "paper | backtest | both"
        default: "both"

permissions:
  contents: write

concurrency:
  group: carry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  carry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB: ${{ github.event.inputs.job || (github.event.schedule == '17 3 * * *' && 'backtest') || 'paper' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Pull carry data from the data branch
        run: |
          set -e
          git config user.name "predictionbots-carry"
          git config user.email "bots@users.noreply.github.com"
          git fetch origin data || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git worktree add ../datawt origin/data
          else
            git worktree add --orphan -b data ../datawt
          fi
          mkdir -p ../datawt/carry data/carry
          cp -r ../datawt/carry/. data/carry/ 2>/dev/null || true
      - name: Paper tick
        if: env.JOB == 'paper' || env.JOB == 'both'
        run: |
          mkdir -p data/carry/logs
          python scripts/carry_paper.py 2>&1 | tee data/carry/logs/paper-$(date -u +%Y%m%dT%H%M).log
      - name: Download + backtest
        if: env.JOB == 'backtest' || env.JOB == 'both'
        run: |
          mkdir -p data/carry/logs
          python scripts/carry_backtest.py --download 2>&1 | tee data/carry/logs/backtest-$(date -u +%Y%m%dT%H%M).log
          python scripts/carry_paper.py --summary
      - name: Push data branch
        run: |
          set -e
          cp -r data/carry/. ../datawt/carry/
          cd ../datawt && git add -A && (git commit -qm "carry data $(date -u +%FT%TZ)" || true)
          for i in 1 2 3 4 5; do
            git push origin HEAD:data && break
            git fetch origin data && git rebase origin/data || git rebase --abort
            sleep $((RANDOM % 20 + 5))
          done
      - name: Commit reports on main
        run: |
          git add reports
          git -c user.name=predictionbots-carry -c user.email=bots@users.noreply.github.com \
            commit -qm "reports: carry update $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && break
            git fetch origin main && git rebase origin/main || git rebase --abort
            sleep $((RANDOM % 20 + 5))
          done
