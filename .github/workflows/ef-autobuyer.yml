# Early Favorite auto-buyer, PAPER mode: reads the live Polymarket US book at 13:00 / 12:00 left
# of every 15-min BTC round, records what a real limit order would fill, scores it at settlement.
# No orders, no key. Each run watches ~5.6 h and publishes every 10 min, so results show up
# while it runs and GitHub's delayed cron starts leave few gaps. Results -> data branch,
# polyus/ef_autobuyer/README.md.
name: ef-autobuyer
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to watch"
        default: "335"

permissions:
  contents: write

concurrency:
  group: ef-autobuyer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install httpx
      - name: Pull existing ledger
        run: |
          git fetch origin data || true
          git worktree add ../datawt origin/data
          mkdir -p data/polyus/ef_autobuyer
          cp -r ../datawt/polyus/ef_autobuyer/. data/polyus/ef_autobuyer/ 2>/dev/null || true
      - name: Watch rounds (paper), publishing every 10 minutes
        run: |
          git config --global user.name "predictionbots-ef"
          git config --global user.email "bots@users.noreply.github.com"
          publish() {
            cd ../datawt
            for i in 1 2 3 4 5; do
              git fetch -q origin data && git reset -q --hard origin/data
              mkdir -p polyus/ef_autobuyer
              cp -r "$GITHUB_WORKSPACE/data/polyus/ef_autobuyer/." polyus/ef_autobuyer/
              python "$GITHUB_WORKSPACE/scripts/ef_autobuyer.py" report --out polyus/ef_autobuyer --history polyus/price_history > /dev/null || true
              git add -A polyus/ef_autobuyer
              git commit -qm "ef-autobuyer $(date -u +%FT%TZ)" || { cd "$GITHUB_WORKSPACE"; return 0; }
              git push -q origin HEAD:data && { cd "$GITHUB_WORKSPACE"; return 0; }
              sleep $((RANDOM % 20 + 5))
            done
            cd "$GITHUB_WORKSPACE"
          }
          python scripts/ef_autobuyer.py run --out data/polyus/ef_autobuyer \
            --minutes "${{ github.event.inputs.minutes || '335' }}" --history ../datawt/polyus/price_history &
          pid=$!
          while kill -0 $pid 2>/dev/null; do
            sleep 600
            publish || true
          done
          wait $pid; rc=$?
          publish
          # a crashed watcher must fail the run, not hide behind a successful publish
          exit $rc
