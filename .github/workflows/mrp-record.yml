# Mr. P recorder (read-only; it never places orders). Captures the exact settlement series the
# Polymarket US 15-min BTC Up/Down market resolves on (CF Benchmarks BRTI, 1-second), plus that
# market's order book and state in each window's final minutes. ~5.6 h per run, publishing every 10 min
# to the `mrp-data` branch, where mrp/REPORT.md is regenerated.
#
# Back-to-back runs: each run asks for its successor when its recorder stops (mrp/gha_record.sh), and the
# concurrency group starts that one the moment this job ends. The hourly cron is only the restart after a
# broken chain: GitHub fires it every 6 to 9 hours on this repo, and relying on it (until 13 Nov 2026) left
# the recorder off for about a fifth of every day.
# To stop the recorder: cancel the running job (a cancelled run starts no successor) and disable this workflow.
# Kit, docs and analyzer live in mrp/ (merged from the `mrp` branch). v0.2: public calls use the gateway host.
name: mrp-record
on:
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to record"
        default: "335"
  push:
    branches: [main]
    paths: [".github/workflows/mrp-record.yml"]

permissions:
  contents: write
  actions: write     # the run dispatches its successor

concurrency:
  group: mrp-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      # Kalshi layer (BRTI push feed + KXBTC15M books) uses the repo's existing secrets; empty = off.
      KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
      KALSHI_PRIVATE_KEY_PEM: ${{ secrets.KALSHI_PRIVATE_KEY_PEM }}
      # Polymarket US WebSocket layer; add these two repo secrets to turn it on. Public REST layer needs nothing.
      POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
      POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
      MRP_DATA_DIR: ${{ github.workspace }}/mrpdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mrp/requirements.txt
      - run: pip install -r mrp/requirements.txt
      - name: Record, publishing every 10 minutes, then start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash mrp/gha_record.sh "${{ github.event.inputs.minutes || '335' }}"
