# BOT BENCHMARK: replay vendors' published rules against our recorded Polymarket US BTC 15-minute books.
# Pulls the recorder data still in git (mrp-data branch, mrp/data: the last week), extracts per-window books and
# prints with mrp/mrp_extract_btc15.py, merges them with the windows published by earlier runs (so the sample keeps
# every window ever extracted, also once its raw books have moved to release assets), runs
# scripts/benchmark_rules.py, and publishes benchmark/ (JSON + BENCHMARK.md + the windows) to the mrp-data branch.
# Dispatch by hand; daily at 09:40 UTC.
name: benchmark
on:
  workflow_dispatch:
    inputs:
      size:
        description: "Contracts per trade (capped at displayed depth)"
        default: "10"
  schedule:
    - cron: "40 9 * * *"

permissions:
  contents: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install httpx
      - run: python scripts/benchmark_rules.py selftest && python scripts/weather_resolve.py selftest
      - name: Fetch the recorder data (mrp-data, sparse)
        run: |
          mkdir -p ../rec && cd ../rec
          git init -q && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # blobless and sparse: the raw books still in git (the last week; older days live in release assets, see
          # scripts/archive_release.py) and the windows this job published before
          git config core.sparseCheckout true && git sparse-checkout set --no-cone mrp/data benchmark
          git fetch -q --depth 1 --filter=blob:none origin mrp-data && git checkout -q FETCH_HEAD
          du -sh mrp/data && find mrp/data -name "*.jsonl*" | wc -l
      # A fresh extraction only sees the books still in git. The windows already published are the memory:
      # scripts/windows_merge.py keeps every one of them and takes the fuller record where both have a window.
      - name: Extract BTC 15-minute windows, merged with the ones already published
        run: |
          set -o pipefail
          python mrp/mrp_extract_btc15.py ../rec/mrp/data btc15.fresh.json | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/windows_merge.py ../rec/benchmark/btc15_windows.json.gz btc15.fresh.json btc15.json | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la btc15.json
      - name: Extract Kalshi BTC 15-minute windows, merged the same way
        run: |
          set -o pipefail
          python mrp/mrp_extract_kalshi15.py ../rec/mrp/data kbtc15.fresh.json --sym btc | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/windows_merge.py ../rec/benchmark/kbtc15_windows.json.gz kbtc15.fresh.json kbtc15.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Replay the rules
        run: |
          python scripts/benchmark_rules.py run --windows btc15.json --out out/benchmark --size "${{ github.event.inputs.size || '10' }}" | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/benchmark_rules.py run --windows kbtc15.json --out out/benchmark_kalshi --size "${{ github.event.inputs.size || '10' }}" --venue kalshi | tee -a "$GITHUB_STEP_SUMMARY" || echo "kalshi replay skipped"
      - name: Publish to mrp-data/benchmark
        run: |
          git config --global user.name "predictionbots-benchmark"
          git config --global user.email "bots@users.noreply.github.com"
          mkdir -p ../pub && cd ../pub
          git init -q && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git config core.sparseCheckout true && git sparse-checkout set --no-cone benchmark weather
          for i in 1 2 3 4 5; do
            git fetch -q --filter=blob:none --depth 1 origin mrp-data && git checkout -q -B mrp-data FETCH_HEAD
            mkdir -p benchmark
            cp "$GITHUB_WORKSPACE"/out/benchmark/benchmark.json "$GITHUB_WORKSPACE"/out/benchmark/BENCHMARK.md benchmark/
            gzip -c "$GITHUB_WORKSPACE"/btc15.json > benchmark/btc15_windows.json.gz
            if [ -f "$GITHUB_WORKSPACE"/out/benchmark_kalshi/benchmark.json ]; then cp "$GITHUB_WORKSPACE"/out/benchmark_kalshi/benchmark.json benchmark/benchmark_kalshi.json; cp "$GITHUB_WORKSPACE"/out/benchmark_kalshi/BENCHMARK.md benchmark/BENCHMARK_KALSHI.md; gzip -c "$GITHUB_WORKSPACE"/kbtc15.json > benchmark/kbtc15_windows.json.gz; fi
            if [ -f weather/snapshots.jsonl ]; then python "$GITHUB_WORKSPACE"/scripts/weather_resolve.py run --snapshots weather/snapshots.jsonl --out weather || true; git add weather; fi
            git add -A benchmark
            git commit -qm "benchmark $(date -u +%FT%TZ)" || { echo "nothing new"; exit 0; }
            git push -q origin HEAD:mrp-data && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          echo "publish failed"; exit 1
