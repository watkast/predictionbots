# Mr. E on BTC (REAL MONEY): the same rule as Mr. E on ETH (scripts/mre_live.js — a 25–30¢ 1-share ladder on both sides, sell
# at 45¢, no buys inside the last 9:00, the rest settles) on the BTC 15-minute Up/Down market. Own switch (mre-btc/LIVE_ON),
# own log (mre-btc/ on `mrp-data`), own tail branch (mre-btc-live-tail); it cancels only its own orders.
name: mre-btc-live
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to run"
        default: "335"
      mode:
        description: "live (orders) or dry"
        default: "live"

permissions:
  contents: write
  actions: write

concurrency:
  group: mre-btc-live-${{ github.event.inputs.mode || 'live' }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
      POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
      MRE_DIR: ${{ github.workspace }}/mredata
      MRE_SLUG_PREFIX: cpc-btc-updown-15m-
      MRE_SUB: mre-btc
      MRE_TAIL_BRANCH: mre-btc-live-tail
      MRE_WORKFLOW: mre-btc-live.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-audit --no-fund ws@8
      - name: Trade (publishing every 10 minutes)
        run: bash mrp/gha_mre.sh "${{ github.event.inputs.minutes || '335' }}" "${{ github.event.inputs.mode || 'live' }}"
