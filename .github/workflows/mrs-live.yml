# Mr. S live (REAL MONEY, hard-capped): buys Kalshi soccer contracts the score has already decided (1H totals / 1H winner /
# 1H BTTS / full-game totals & BTTS) when ESPN and Polymarket agree and someone still sells below the cap; holds to settlement.
# Caps: $10/order, $20/game, $40/day, $50 open risk. Any losing trade halts new orders until a human resets it.
# Switch: the file mrs/LIVE_ON on main (checked every 5 min; delete it to stop new orders; cancel the job to stop at once).
# Starts when this PR merges (push trigger) and re-dispatches itself while the switch exists; the :23 cron is a backstop.
# Report: mrs/MRS.md on the `mrp-data` branch every 5 minutes.
name: mrs-live
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to run"
        default: "335"
      mode:
        description: "live (orders) or dry"
        default: "live"
  push:
    branches: [main]
    paths: ["mrs/LIVE_ON", ".github/workflows/mrs-live.yml", "mrp/mrs_live.py"]

permissions:
  contents: write
  actions: write

concurrency:
  group: mrs-live-${{ github.event.inputs.mode || 'live' }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
      KALSHI_PRIVATE_KEY_PEM: ${{ secrets.KALSHI_PRIVATE_KEY_PEM }}
      MRS_DIR: ${{ github.workspace }}/mrsdata
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mrp/requirements.txt
      - run: pip install -r mrp/requirements.txt
      - name: Trade (publishing every 5 minutes)
        run: bash mrp/gha_mrs.sh "${{ github.event.inputs.minutes || '335' }}" "${{ github.event.inputs.mode || 'live' }}"
