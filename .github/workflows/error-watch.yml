# Error watch: when any bot workflow finishes red, open (or bump) a P0 Error ticket for its bot.
# Cancelled runs are skipped (concurrency and manual cancels are normal). Tickets are deduped by
# fingerprint wf:<workflow>, so a workflow that fails every hour has ONE ticket with a comment per failure.
name: error-watch
on:
  workflow_run:
    workflows: [backtest, bounty-scan, carry, ci, ef-autobuyer, paper, polyus, record, trend, health]
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  ticket:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Open or bump the Error ticket
        env:
          GH_TOKEN: ${{ github.token }}
          WF: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # failed steps, for the ticket body
          steps=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            -q '.jobs[] | select(.conclusion=="failure") | "- job `\(.name)`: " + ([.steps[] | select(.conclusion=="failure") | .name] | join(", "))' || true)
          body=$(printf 'Workflow **%s** finished `%s`.\n\nRun: %s\nCommit: %s\n\nFailed steps:\n%s\n\nReproduce: open the run log, find the first red line. The errors.jsonl of this bot (if it uses pb.errlog) has the traceback.' \
            "$WF" "$CONCLUSION" "$RUN_URL" "$SHA" "${steps:-- (see run log)}")
          python scripts/tracker.py error "$WF run $CONCLUSION" --bot "$WF" --fingerprint "wf:$WF" --body "$body"
