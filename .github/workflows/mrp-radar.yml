# Mr. P sports radar (read-only; never places orders; public endpoints only — no secrets).
# Scans every sports market on Polymarket US and Kalshi for outcome-already-known contracts,
# dutch books, cross-venue gaps and settlement lag, and records 60 s snapshots to fingerprint
# who quotes each market. Same shape as mrp-record.yml: ~5.6 h per run, hourly cron + concurrency
# group = back-to-back runs, publishing every 10 min to the `mrp-data` branch (mrp/RADAR.md).
name: mrp-radar
on:
  schedule:
    - cron: "44 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to scan"
        default: "335"
  push:
    branches: [main]
    paths: [".github/workflows/mrp-radar.yml"]

permissions:
  contents: write

concurrency:
  group: mrp-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      MRP_DATA_DIR: ${{ github.workspace }}/radardata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mrp/requirements.txt
      - run: pip install -r mrp/requirements.txt
      - name: Scan, publishing every 10 minutes
        run: bash mrp/gha_radar.sh "${{ github.event.inputs.minutes || '335' }}"
