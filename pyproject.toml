[project]
name = "predictionbots"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "websockets>=12", "numpy", "pandas", "pyarrow", "cryptography", "pydantic>=2", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
